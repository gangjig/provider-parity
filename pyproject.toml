[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "provider-parity"
version = "0.1.0"
description = "Check whether the same model served by different providers is actually the same model: probe-based parity reports."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Gang Ji" }]
keywords = ["llm", "evaluation", "providers", "agents", "benchmarking"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = []

[project.scripts]
provider-parity = "provider_parity.cli:main"

[project.urls]
Homepage = "https://github.com/gangjig/provider-parity"
Repository = "https://github.com/gangjig/provider-parity"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
provider_parity = ["data/*.json", "data/*.jsonl"]

[tool.pytest.ini_options]
testpaths = ["tests"]
